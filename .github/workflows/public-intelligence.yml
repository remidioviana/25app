name: Build public source intelligence
on:
  workflow_dispatch:
    inputs:
      lot:
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
        description: 'Five bounded public-information briefings; potentially billable inference'
      allow_preview:
        type: boolean
        default: false
        description: 'Explicit opt-in to Qwen Preview in the three-model evaluation profile'
permissions:
  contents: read
concurrency:
  group: verify-groq
  cancel-in-progress: false
jobs:
  public-briefs:
    if: ${{ inputs.allow_preview }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agentic.txt -r requirements-documents.txt
      - name: Build bounded public briefings
        timeout-minutes: 18
        env:
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          AGENT_PLANNER_MODEL: openai/gpt-oss-20b
          AGENT_SPECIALIST_MODEL: qwen/qwen3.8-27b
          AGENT_AUDITOR_MODEL: openai/gpt-oss-120b
          AGENT_REQUIRE_DISTINCT_MODELS: '1'
          AGENT_ALLOW_PREVIEW_MODELS: '1'
          PORTFOLIO_LOT: ${{ inputs.lot }}
        run: python scripts/build_public_intelligence.py --live --lot "$PORTFOLIO_LOT" --output project/evidence/public-intelligence-actions.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-intelligence-report
          path: project/evidence/public-intelligence-actions.json
          if-no-files-found: warn
          retention-days: 7
