name: Verify official source RAG by lot
on:
  workflow_dispatch:
    inputs:
      batch:
        type: choice
        description: 'Live public HTTP plus controlled model roles; no provider calls'
        options: ['2', '3', '4', '5', remaining]
        default: remaining
permissions:
  contents: read
jobs:
  source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agentic.txt -r requirements-documents.txt
      - env:
          PORTFOLIO_BATCH: ${{ inputs.batch }}
        run: python scripts/verify_remaining_portfolio.py --live-sources --batch "$PORTFOLIO_BATCH" --output project/evidence/portfolio-source-actions.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-source-controlled-graph-report
          path: project/evidence/portfolio-source-actions.json
          if-no-files-found: warn
          retention-days: 7
