name: Verify official source RAG by lot
on:
  workflow_dispatch:
    inputs:
      batch:
        type: choice
        description: 'Live public HTTP plus controlled model roles; no provider calls'
        options: ['2', '3', '4', '5', remaining]
        default: remaining
      financial_pair_only:
        type: boolean
        description: 'Check only Mizan and Manzil in lot 4; no provider inference'
        default: false
permissions:
  contents: read
jobs:
  source-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agentic.txt -r requirements-documents.txt
      - env:
          PORTFOLIO_BATCH: ${{ inputs.batch }}
          FINANCIAL_PAIR_ONLY: ${{ inputs.financial_pair_only }}
        run: |
          args=(--live-sources --batch "$PORTFOLIO_BATCH" --output project/evidence/portfolio-source-actions.json)
          if [ "$FINANCIAL_PAIR_ONLY" = true ]; then
            if [ "$PORTFOLIO_BATCH" != 4 ]; then echo "Financial pair requires lot 4."; exit 2; fi
            args+=(--app mizan --app manzil)
          fi
          python scripts/verify_remaining_portfolio.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-source-controlled-graph-report
          path: project/evidence/portfolio-source-actions.json
          if-no-files-found: warn
          retention-days: 7
