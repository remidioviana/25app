name: Code checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements*.txt'
      - 'tests/**'
      - 'scripts/**'
      - 'mobile/**'
      - 'brand-assets/**'
      - 'apps/apps.json'
      - 'project/portfolio.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '*.py'
      - 'requirements*.txt'
      - 'tests/**'
      - 'scripts/**'
      - 'mobile/**'
      - 'brand-assets/**'
      - 'apps/apps.json'
      - 'project/portfolio.json'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-agentic.txt
            requirements-documents.txt
      - name: Install Python verification dependencies
        run: python -m pip install -r requirements-agentic.txt -r requirements-documents.txt
      - name: Backend regressions and portfolio consistency
        run: |
          python -m unittest discover -s tests -q
          python scripts/check_portfolio.py
          python scripts/audit_english.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile verification dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile typecheck, lint, regressions and 25 variant configurations
        working-directory: mobile
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run check:variants
