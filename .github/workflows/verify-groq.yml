name: Verify Groq connection
on:
  workflow_dispatch:
    inputs:
      probe_models:
        description: 'Run potentially billable tool roundtrips for all three roles'
        type: boolean
        default: false
      model_profile:
        description: 'Three-model evaluation uses Qwen Preview; requires allow_preview'
        type: choice
        options: [production-default, three-model-evaluation]
        default: production-default
      team_first_five:
        description: 'Run potentially billable first-five graphs with synthetic inputs and official source RAG'
        type: boolean
        default: false
      team_app:
        description: 'Integrated diagnostic scope; single app reduces quota consumption'
        type: choice
        options: [first-five, himayah, iqamah, istithmar, munagasah, sahil]
        default: first-five
      exclude_app:
        description: 'Exclude one app already verified separately from the selected scope'
        type: choice
        options: [none, himayah, iqamah, istithmar, munagasah, sahil]
        default: none
      reviewed_himayah_snapshot:
        description: 'Explicitly use reviewed historical PDPL snapshot for Himayah; not a fresh source read'
        type: boolean
        default: false
      allow_preview:
        description: 'Explicitly allow configured Preview model'
        type: boolean
        default: false
      allow_shared_models:
        description: 'Diagnostic only: permit roles to share models'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-groq
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify protected configuration and optional model tool roundtrips
        env:
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          AGENT_PLANNER_MODEL: ${{ inputs.model_profile == 'three-model-evaluation' && 'openai/gpt-oss-20b' || vars.AGENT_PLANNER_MODEL || 'openai/gpt-oss-20b' }}
          AGENT_SPECIALIST_MODEL: ${{ inputs.model_profile == 'three-model-evaluation' && 'openai/gpt-oss-120b' || vars.AGENT_SPECIALIST_MODEL || 'openai/gpt-oss-20b' }}
          AGENT_AUDITOR_MODEL: ${{ inputs.model_profile == 'three-model-evaluation' && 'qwen/qwen3.8-27b' || vars.AGENT_AUDITOR_MODEL || 'openai/gpt-oss-120b' }}
          AGENT_ALLOW_PREVIEW_MODELS: ${{ inputs.allow_preview && '1' || '0' }}
          AGENT_REQUIRE_DISTINCT_MODELS: ${{ inputs.model_profile == 'three-model-evaluation' && '1' || '0' }}
          PROBE_MODELS: ${{ inputs.probe_models }}
          ALLOW_SHARED_MODELS: ${{ inputs.allow_shared_models }}
        run: |
          args=(--live --output project/evidence/groq-actions.json)
          if [ "$PROBE_MODELS" = true ]; then args+=(--probe-models); fi
          if [ "$ALLOW_SHARED_MODELS" = true ]; then args+=(--allow-shared-models); fi
          python scripts/verify_groq.py "${args[@]}"
      - name: Install graph and public PDF dependencies
        if: ${{ inputs.team_first_five }}
        run: python -m pip install -r requirements-agentic.txt -r requirements-documents.txt
      - name: Verify first-five graphs with live RAG and synthetic domain inputs
        if: ${{ inputs.team_first_five }}
        env:
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          AGENT_PLANNER_MODEL: ${{ inputs.model_profile == 'three-model-evaluation' && 'openai/gpt-oss-20b' || vars.AGENT_PLANNER_MODEL || 'openai/gpt-oss-20b' }}
          AGENT_SPECIALIST_MODEL: ${{ inputs.model_profile == 'three-model-evaluation' && 'openai/gpt-oss-120b' || vars.AGENT_SPECIALIST_MODEL || 'openai/gpt-oss-20b' }}
          AGENT_AUDITOR_MODEL: ${{ inputs.model_profile == 'three-model-evaluation' && 'qwen/qwen3.8-27b' || vars.AGENT_AUDITOR_MODEL || 'openai/gpt-oss-120b' }}
          AGENT_ALLOW_PREVIEW_MODELS: ${{ inputs.allow_preview && '1' || '0' }}
          AGENT_REQUIRE_DISTINCT_MODELS: ${{ inputs.model_profile == 'three-model-evaluation' && '1' || '0' }}
          AGENT_SEMANTIC_SEARCH: '0'
          AGENT_MAX_EVIDENCE_PASSAGES: '2'
          TEAM_APP: ${{ inputs.team_app }}
          EXCLUDE_APP: ${{ inputs.exclude_app }}
          REVIEWED_HIMAYAH_SNAPSHOT: ${{ inputs.reviewed_himayah_snapshot }}
        run: |
          args=(--live --output project/evidence/groq-team-actions.json)
          if [ "$TEAM_APP" != first-five ]; then args+=(--app "$TEAM_APP"); fi
          if [ "$EXCLUDE_APP" != none ]; then args+=(--exclude-app "$EXCLUDE_APP"); fi
          if [ "$REVIEWED_HIMAYAH_SNAPSHOT" = true ]; then args+=(--reviewed-himayah-snapshot); fi
          python scripts/verify_team.py "${args[@]}"
      - name: Upload redacted verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groq-verification
          path: |
            project/evidence/groq-actions.json
            project/evidence/groq-team-actions.json
          if-no-files-found: ignore
          retention-days: 7
