<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Himayah — bilingual home design proof</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ede7dc;color:#172037;font-family:Arial,sans-serif;padding:36px}header{max-width:1540px;margin:0 auto 28px}header p{max-width:950px;line-height:1.5}h1{font-size:42px;margin:6px 0}h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#6b5949;margin:0 0 12px}small{color:#5d5148}.grid{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:22px;max-width:1540px;margin:auto}.phone{background:#151e37;color:#f4e7d5;border:7px solid #10151f;border-radius:38px;min-height:720px;padding:20px 19px 22px;box-shadow:0 10px 24px #17203720;position:relative}.android{border-radius:24px}.status{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold;margin-bottom:28px;direction:ltr}.capsule{width:67px;background:#050608;height:14px;border-radius:10px}.hole{width:9px;height:9px;border-radius:50%;background:#050608}.brand{font-size:17px;font-weight:700}.lang{display:inline-flex;border:1px solid #585a66;border-radius:12px;margin-top:8px;padding:3px;direction:ltr}.lang span{padding:10px 12px;font-size:13px}.selected{background:#212940;border-radius:8px;font-weight:bold}.title{font-size:33px;line-height:1.12;letter-spacing:-.6px;margin:21px 0 12px}.intro,.note{font-size:14px;line-height:1.5;color:#c7bfb5}.docket{margin-top:20px;background:#212940;border-radius:12px;padding:18px}.label{font-size:12px;color:#c7bfb5;font-weight:600}.value{font-weight:700;font-size:21px;margin:6px 0}.sep{height:1px;background:#585a66;margin:14px 0}.step{margin:20px 0 8px}.button{color:#101b16;background:#e7695e;border-radius:4px;text-align:center;font-weight:700;padding:16px 10px;font-size:14px}.source{border-top:1px solid #585a66;margin-top:16px;padding-top:14px}.source strong{font-size:15px}.note{margin-top:8px}.homeindicator{width:108px;height:4px;border-radius:6px;background:#ddd;position:absolute;bottom:9px;left:calc(50% - 54px)}[dir=rtl]{font-family:Arial,sans-serif;letter-spacing:0}.platform{padding:0 4px 11px;font-size:15px;font-weight:700}.caption{font-size:12px;line-height:1.5;margin-top:12px;color:#665344}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(250px,1fr))}}@media(max-width:600px){body{padding:16px}.grid{grid-template-columns:1fr}}
</style>
<header><h2>25APP / Product design proof</h2><h1>Himayah — privacy docket</h1><p>Task-first workspace, without an oversized brand mark. English is the default; the Arabic home copy mirrors reading direction. These are static design simulations, not native screenshots, and represent an empty document workspace.</p></header>
<main class="grid" id="grid"></main>
<script>
const strings={
 en:{brand:'Himayah',title:'Your privacy docket',intro:'Review the obligations in an agreement, trace the evidence and keep decisions yours.',doc:'Document',empty:'No text added',rules:'Screening rules',zero:'0',ruleNote:'User-defined phrase rules',next:'Your next step',button:'Start a new review',notice:'Local phrase screening is not a legal verdict. Connected analysis requires a configured service.',sources:'Official sources',sourceNote:'Read the published context before making a decision.'},
 ar:{brand:'حماية',title:'ملف مراجعة الخصوصية',intro:'راجع الالتزامات في الاتفاقية، وتتبع الأدلة، واحتفظ بقرارك النهائي.',doc:'المستند',empty:'لم يُضف نص بعد',rules:'قواعد الفحص',zero:'٠',ruleNote:'قواعد عبارات يحددها المستخدم',next:'خطوتك التالية',button:'ابدأ مراجعة جديدة',notice:'فحص العبارات محلياً ليس حكماً قانونياً. يتطلب التحليل المتصل خدمة مهيأة.',sources:'المصادر الرسمية',sourceNote:'اطلع على السياق المنشور قبل اتخاذ القرار.',scope:'تُستخدم الإنجليزية في بقية خطوات العمل إلى حين اكتمال التعريب.'}
};
for(const [platform,language] of [['iOS','en'],['Android','en'],['iOS','ar'],['Android','ar']]){
 const t=strings[language];const rtl=language==='ar';const android=platform==='Android';
 const el=document.createElement('section');
 el.innerHTML=`<div class="platform">${platform} · ${rtl?'Arabic':'English'}</div><article class="phone ${android?'android':''}" lang="${language}" dir="${rtl?'rtl':'ltr'}"><div class="status"><span>9:41</span><span class="${android?'hole':'capsule'}"></span><span>● ▰</span></div><div class="brand">${t.brand}</div><div class="lang"><span class="${rtl?'':'selected'}">English</span><span class="${rtl?'selected':''}">العربية</span></div><h3 class="title">${t.title}</h3><div class="intro">${t.intro}</div><div class="docket"><div class="label">${t.doc}</div><div class="value">${t.empty}</div><div class="sep"></div><div class="label">${t.rules}</div><div class="value">${t.zero}</div><div class="note">${t.ruleNote}</div></div><div class="label step">${t.next}</div><div class="button">${t.button}</div><div class="note">${t.notice}</div><div class="source"><strong>${t.sources}</strong><div class="note">${t.sourceNote}</div></div>${rtl?'<div class="note">'+t.scope+'</div>':''}<div class="homeindicator"></div></article><div class="caption">Design simulation · empty state · not a device capture</div>`;
 document.querySelector('#grid').append(el);
}
</script>
</html>
